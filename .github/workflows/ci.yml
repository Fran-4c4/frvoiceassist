name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # No GPU required: tests use fake TTS and transcription engines
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Instalar dependencias
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint
        run: ruff check app tests scripts

      - name: Tests (Python)
        run: pytest

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Tests (JS, división en frases)
        run: node --test tests/js/sentences.test.js
